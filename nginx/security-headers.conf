# Security headers, matching what scalesafe.co.in served on 2026-11-14.
# Included in every location: nginx drops server-level add_header lines in any
# location that sets its own add_header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# "noindex, nofollow" on preview hosts only; empty (not sent) on scalesafe.co.in. See default.conf.
add_header X-Robots-Tag $x_robots_tag always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com https://challenges.cloudflare.com $api_origin; frame-src https://challenges.cloudflare.com; form-action 'self' https://formsubmit.co $api_origin; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
