# scalesafe.co.in static site on 8080 (non-root nginx), AIO conventions:
# /health for Kubernetes probes; TLS terminates at the ingress.

# Any host other than the real domain is a preview/test host: keep it out of search engines.
# When scalesafe.co.in is pointed at this container, it is served normally with no change here.
map $host $is_preview {
  default               1;
  scalesafe.co.in       0;
  www.scalesafe.co.in   0;
}
map $is_preview $x_robots_tag {
  1 "noindex, nofollow";
  0 "";   # empty value: nginx sends no header
}

# The pages are built with the production API origin (newsletter form). On the pre-corporate staging domain
# indiescale.in the same image points them at api.indiescale.in instead; every other host is unchanged.
map $host $api_origin {
  default               "https://api.scalesafe.co.in";
  indiescale.in         "https://api.indiescale.in";
  www.indiescale.in     "https://api.indiescale.in";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Directory redirects (/terms -> /terms/) must not leak the container port.
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;
  gzip_min_length 1024;

  # See map $api_origin: HTML only (sub_filter's default type; the endpoint is a data- attribute in the pages).
  sub_filter_once off;
  sub_filter "https://api.scalesafe.co.in" $api_origin;

  error_page 404 /404.html;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"UP"}';
  }

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # Matches the live site: images and fonts cached for 30 days.
  location ^~ /img/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }
  location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # nginx's mime.types has no webmanifest entry; the live site sends application/manifest+json.
  location = /site.webmanifest {
    types { }
    default_type application/manifest+json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # Preview hosts get a disallow-all robots.txt; the real domain gets the site's own file.
  location = /robots.txt {
    default_type text/plain;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    if ($is_preview) {
      return 200 "# Preview environment - not for indexing.\nUser-agent: *\nDisallow: /\n";
    }
  }

  # Robots disallows these on the live site; nothing is served here.
  location ^~ /api/ { return 404; }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ =404;
  }
}
