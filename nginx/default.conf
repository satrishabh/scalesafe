# scalesafe.co.in static site on 8080 (non-root nginx), AIO conventions:
# /health for Kubernetes probes; TLS terminates at the ingress.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Directory redirects (/terms -> /terms/) must not leak the container port.
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;
  gzip_min_length 1024;

  error_page 404 /404.html;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"UP"}';
  }

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # Matches the live site: images and fonts cached for 30 days.
  location ^~ /img/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }
  location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # nginx's mime.types has no webmanifest entry; the live site sends application/manifest+json.
  location = /site.webmanifest {
    types { }
    default_type application/manifest+json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # Robots disallows these on the live site; nothing is served here.
  location ^~ /api/ { return 404; }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ =404;
  }
}
